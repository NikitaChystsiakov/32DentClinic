# Боевой конфиг nginx для 32dent.by — заменяет /etc/nginx/sites-enabled/app.
# Статический сайт из /var/www/32dent + PHP-скрипт формы записи.
# Главный адрес — https://32dent.by (без www), остальные варианты — 301 туда.
# Порядок применения и откат — docs/ДЕПЛОЙ-VPS.md, шаг 8.
#
# Редиректы старых адресов — копия RedirectMatch из public/.htaccess:
# поменяли там — поменяйте и здесь.

# http://32dent.by, http://www.32dent.by → https://32dent.by
server {
    listen 80;
    listen [::]:80;
    server_name 32dent.by www.32dent.by;

    return 301 https://32dent.by$request_uri;
}

# https://www.32dent.by → https://32dent.by (сертификат должен включать www)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.32dent.by;

    ssl_certificate /etc/letsencrypt/live/32dent.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/32dent.by/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://32dent.by$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 32dent.by;

    ssl_certificate /etc/letsencrypt/live/32dent.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/32dent.by/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/32dent;
    index index.html;
    charset utf-8;
    error_page 404 /404.html;
    # /minsk → /minsk/ без подстановки схемы и хоста.
    absolute_redirect off;

    # Готовые .gz (gzip 9) кладёт рядом с файлами scripts/precompress.mjs
    # (pnpm build) — на четверть меньше прежнего сжатия на лету уровнем 1.
    # Brotli был бы ещё вдвое меньше, но nginx здесь из репозитория ISPmanager
    # (1.30), и модуль Ubuntu libnginx-mod-http-brotli-static к нему не ставится;
    # .br-файлы скрипт всё равно кладёт — пригодятся, если модуль появится
    # (тогда добавить `brotli_static on;`).
    # На лету (gzip 6) жмётся только то, для чего готового файла нет.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # 301 со старых адресов (рогачёвская версия и /doctors/<id> старого сайта).
    rewrite ^/uslugi/(.*)$ /rogachev/uslugi/$1 permanent;
    rewrite ^/vrachi/(.*)$ /rogachev/vrachi/$1 permanent;
    rewrite ^/ceny/?$ /rogachev/ceny/ permanent;
    rewrite ^/o-nas/(.*)$ /rogachev/o-nas/$1 permanent;
    rewrite ^/kontakty/?$ /rogachev/kontakty/ permanent;
    rewrite ^/kalkulyator/?$ /rogachev/kalkulyator/ permanent;
    rewrite ^/primery-rabot/?$ /rogachev/primery-rabot/ permanent;
    rewrite ^/doctors/7af01a7dbdef40088c301a03c77cb08a/?$ /rogachev/vrachi/ilyushchenko-natalya/ permanent;
    rewrite ^/doctors/1d4f54856d6b4570a3a06d1907f9ac8d/?$ /minsk/vrachi/alekseychik-yuliya/ permanent;
    rewrite ^/doctors/4559a53c30b7429a8917699b8773cc69/?$ /zhlobin/vrachi/pavlovich-sergey/ permanent;
    rewrite ^/doctors/48560865387f4839ac367ac366180047/?$ /zhlobin/vrachi/makhonko-pavel/ permanent;
    rewrite ^/doctors/856cf2228a024b128be3fef9eff6f414/?$ /rogachev/vrachi/bychkov-ivan/ permanent;
    rewrite ^/doctors/a417fa552f1b44ffb9e66b3b0467366d/?$ /rogachev/vrachi/saykovskaya-tatyana/ permanent;
    rewrite ^/doctors/bd48e7babeaa42c0b89b1b81f94d5f4f/?$ /rogachev/vrachi/kovalchuk-igor/ permanent;
    rewrite ^/doctors/cb9d841ddfe44a9e9a7514a9614515f6/?$ /minsk/vrachi/belousova-tatyana/ permanent;
    rewrite ^/doctors/d832260bb3454b64856b17323dda2a05/?$ /zhlobin/vrachi/kireev-vladislav/ permanent;
    rewrite ^/doctors/f2fc83df14094fd7b7a49bf4a911a932/?$ /zhlobin/vrachi/alekseychuk-vyacheslav/ permanent;
    rewrite ^/doctors(/.*)?$ / permanent;

    location / {
        try_files $uri $uri/ =404;
    }

    # Хэшированные файлы Next — кеш навсегда.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Видео — неделя.
    location ^~ /video/ {
        add_header Cache-Control "public, max-age=604800";
    }
    # Картинки, иконки, шрифты — месяц.
    location ~* \.(webp|jpe?g|png|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # Наружу отдаётся только booking.php; config.php и прочие .php закрыты.
    location = /api/booking.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ {
        return 404;
    }

    # .htaccess, .DS_Store и прочие скрытые файлы (кроме .well-known для certbot).
    location ~ /\.(?!well-known) {
        return 404;
    }
}
